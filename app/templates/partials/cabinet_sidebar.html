<aside class="cabinet-side">
  <a class="side-logo" href="/cabinet" aria-label="Жертап">
    <span class="brand-mark">Ж</span>
    <strong>Жертап</strong>
  </a>
  <div class="side-account">
    <strong>{{ account.phone }}</strong>
    <span>{{ access_label if access_label is defined else ("Доступ активен" if account.paid_access else "Бесплатный режим") }}</span>
  </div>

  <nav class="side-nav" aria-label="Меню кабинета">
    <a class="{{ 'is-active' if request.url.path == '/cabinet' else '' }}" href="/cabinet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
      Обзор
    </a>
    <a class="{{ 'is-active' if request.url.path.startswith('/cabinet/land-guide') else '' }}" href="/cabinet/land-guide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7v5c0 5 3.4 8.1 8 9 4.6-.9 8-4 8-9V7z"/><path d="m9 12 2 2 4-4"/></svg>
      Как получить землю
    </a>
    <a class="{{ 'is-active' if request.url.path == '/cabinet/search' else '' }}" href="/cabinet/search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/><circle cx="12" cy="12" r="9"/></svg>
      Новый анализ
    </a>
    <a href="/cabinet#recent-analyses">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/><path d="M12 7v5l3 2"/></svg>
      История анализов
    </a>

    <a class="{{ 'is-active' if request.url.path.startswith('/cabinet/auctions-v2') else '' }}" href="/cabinet/auctions-v2">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 4 6 6"/><path d="m4 14 6 6"/><path d="m7 17 10-10"/><path d="m3 21 6-6"/><path d="m15 9 6-6"/></svg>
      Аукционы
    </a>

    <span class="side-separator"></span>
    <a class="{{ 'is-active' if request.url.path.startswith('/cabinet/payment') else '' }}" href="/cabinet/payment">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>
      Оплата
    </a>
    <a class="{{ 'is-active' if request.url.path.startswith('/cabinet/help') else '' }}" href="/cabinet/help">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 1 1 5.1 2.1c-.8.7-1.2 1.1-1.2 2.4"/><path d="M12 17h.01"/></svg>
      Как пользоваться
    </a>
    <a class="{{ 'is-active' if request.url.path.startswith('/cabinet/feedback') else '' }}" href="/cabinet/feedback">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/></svg>
      Обратная связь
    </a>
    <a class="{{ 'is-active' if request.url.path.startswith('/cabinet/settings') else '' }}" href="/cabinet/settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.8 1.8 0 0 0 .4 2l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.8 1.8 0 0 0-2-.4 1.8 1.8 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.8 1.8 0 0 0-1-1.6 1.8 1.8 0 0 0-2 .4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.8 1.8 0 0 0 .4-2 1.8 1.8 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.8 1.8 0 0 0 1.6-1 1.8 1.8 0 0 0-.4-2l-.1-.1A2 2 0 1 1 7 4.1l.1.1a1.8 1.8 0 0 0 2 .4 1.8 1.8 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.8 1.8 0 0 0 1 1.6 1.8 1.8 0 0 0 2-.4l.1-.1A2 2 0 1 1 20 7l-.1.1a1.8 1.8 0 0 0-.4 2 1.8 1.8 0 0 0 1.6 1h.1a2 2 0 1 1 0 4h-.1a1.8 1.8 0 0 0-1.7 1Z"/></svg>
      Настройки
    </a>
  </nav>

  <form class="side-logout" method="post" action="/logout">
    <input type='hidden' name='csrf_token' value='{{ csrf_token(request) }}'>
    <button type="submit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17 15 12l-5-5"/><path d="M15 12H3"/><path d="M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg>
      Выйти
    </button>
  </form>
</aside>
