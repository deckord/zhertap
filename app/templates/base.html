<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=20260731f">
</head>
<body class="admin-body">
  <header class="topbar">
    <a class="brand" href="/admin" aria-label="{{ app_name }}">
      <span class="brand-mark">Ж</span>
      <span>
        <strong>{{ app_name }}</strong>
        <small>операторская панель</small>
      </span>
    </a>
    <nav class="topnav" aria-label="Основные разделы">
      <a class="{{ 'is-active' if request.url.path == '/admin' else '' }}" href="/admin">Заявки</a>
      <a class="{{ 'is-active' if request.url.path.startswith('/admin/auctions') else '' }}" href="/admin/auctions">Аукционы</a>
      <a class="{{ 'is-active' if request.url.path.startswith('/admin/feedback') else '' }}" href="/admin/feedback">Обратная связь</a>
      <a class="{{ 'is-active' if request.url.path.startswith('/admin/urban-plans') else '' }}" href="/admin/urban-plans">Генпланы и ПДП</a>
      <a class="{{ 'is-active' if request.url.path.startswith('/admin/analytics') else '' }}" href="/admin/analytics">Аналитика</a>
    </nav>
    <a class="site-link" href="/" target="_blank" rel="noreferrer">Открыть сайт</a>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
</body>
</html>
